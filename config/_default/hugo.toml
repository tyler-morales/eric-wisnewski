# No theme: site uses layouts/ only. Do not add theme = '' or Cloudflare/CI will fail.
baseURL = 'https://ericwisnewski.com'
languageCode = 'en-us'
title = 'Eric Wisnewski'
# Pages CMS stores publish dates with a literal Z (UTC). Contributors often save a
# local "now" that is still a few minutes in the future at deploy time; without this,
# Hugo omits the post and Cloudflare serves the home page at its URL. Applies to all
# sections (Eric's Posts, Grady's Tour, Da Breakdown w Tad) — intended for this CMS-edited site.
buildFuture = true

[imaging]
  quality = 85
  resampleFilter = "Lanczos"
  hint = "picture"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Pin section URLs so author collections cannot drift if CMS creates subfolders.
[permalinks]
  posts = '/posts/:slug/'
  gradys-tour = '/gradys-tour/:slug/'
  da-breakdown-w-tad = '/da-breakdown-w-tad/:slug/'
  authors = '/authors/:slug/'
  updates = '/updates/:slug/'

[params]
  description = 'Eric Wisnewski — personal site and blog'
  # CSV URL for School Sheets page (File > Share > Publish to web, or export URL if sheet is public)
  school_sheets_csv_url = 'https://docs.google.com/spreadsheets/d/1fyJS_hWWZw4gu_1VYxgz2Laetw5az1c2LPuvCgHrl1U/export?format=csv&gid=0'
  # Link to open the sheet in Google Sheets (optional; used for "View original" on /school-sheets/)
  school_sheets_view_url = 'https://docs.google.com/spreadsheets/d/1fyJS_hWWZw4gu_1VYxgz2Laetw5az1c2LPuvCgHrl1U/edit'
  nav_school_sheets = '/school-sheets/'
  nav_map = '/map/'
  nav_gradys_tour = '/gradys-tour/'
  nav_da_breakdown_w_tad = '/da-breakdown-w-tad/'
  # Link to open the map in Google Maps (optional; used for "View original" on /map/)
  map_viewer_url = 'https://www.google.com/maps/d/viewer?mid=1iRNx3DgEm5TJJmN1A4xM0uienUMFfqc'
  # Cloudflare Turnstile site key for comments (from Cloudflare Dashboard → Turnstile)
  turnstile_site_key = '0x4AAAAAACnww42_mYvpidw1'
  # Umami analytics (https://cloud.umami.is). Script loads only in production when website_id is set.
  umami_website_id = '8c6d1d8a-61c0-4a59-b7bd-28ba660afd08'
  umami_script_url = 'https://cloud.umami.is/script.js'
  # Newsletter (D1 + Resend). Form is live; emails need RESEND_API_KEY on Cloudflare Pages.
  newsletter_enabled = true
  # Site footer credit
  builder_name = 'Tyler Morales'
  builder_url = 'https://tylermorales.pro'

# Publish /authors/<slug>/ profiles; keep the /authors/ index unpublished.
[[cascade]]
  [cascade.build]
    list = 'never'
    render = 'never'
  [cascade.target]
    path = '/authors'

# Updates: each note has its own page at /updates/<slug>/, but notes are listed
# only on /updates/ — never mixed into the home page feed of posts.
[[cascade]]
  [cascade.build]
    list = 'never'
  [cascade.target]
    path = '/updates'

[[cascade]]
  [cascade.build]
    list = 'local'
  [cascade.target]
    kind = 'page'
    path = '/updates/**'

# Grady's Tour posts always attribute to Grady even if CMS author is missing.
[[cascade]]
  [cascade.params]
    author = 'grady-davis'
  [cascade.target]
    path = '{/gradys-tour,/gradys-tour/**}'

# Da Breakdown posts always attribute to Tad even if CMS author is missing.
[[cascade]]
  [cascade.params]
    author = 'tad'
  [cascade.target]
    path = '{/da-breakdown-w-tad,/da-breakdown-w-tad/**}'
