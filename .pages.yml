# Pages CMS — https://app.pagescms.org/
# Edit content and media here; contributors sign in with email (magic link). Repo backend: GitHub; config drives the CMS UI.

# Restrict to web-friendly formats to avoid huge files that can trigger 504 on upload.
media:
  input: assets/images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    format: yaml-frontmatter
    filename: "{{slug}}.md"
    exclude: [_index.md]
    view:
      primary: name
      fields: [name, slug]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly id (e.g. eric-wisnewski). Posts reference this value.
      - name: bio
        label: Bio
        type: text
        required: true
        description: Short bio shown under posts by this author.
      - name: image
        label: Photo
        type: image
        required: false
        description: Author photo shown with the bio under posts.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Notes
        type: text
        required: false
        description: Optional internal notes (not shown on the site).
        hidden: true

  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{{slug}}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. my-first-post). Used for the filename.
      - name: author
        label: Author
        type: reference
        required: true
        description: Who wrote this post. Add people under Authors first. Grady's travel posts belong in the Grady's Tour collection, not here.
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: date
        label: Publish Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-02-26T10:25:00Z). Hugo requires RFC3339; missing seconds can cause "date front matter field is not a parsable date".
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Featured Image
        type: image
        required: false
        description: Pick from the media library or upload via the CMS.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Body
        type: rich-text

  - name: gradys-tour
    label: Grady's Tour
    type: collection
    path: content/gradys-tour
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    exclude: [_index.md]
    subfolders: false
    view:
      primary: title
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. from-boat-to-bus). Used for the filename.
      - name: author
        label: Author
        type: reference
        required: true
        default: grady-davis
        description: Who wrote this post. Travel posts in this folder appear only on Grady's Tour, not the home page.
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: date
        label: Publish Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-02-26T10:25:00Z). Hugo requires RFC3339; missing seconds can cause "date front matter field is not a parsable date".
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Featured Image
        type: image
        required: false
        description: Pick from the media library or upload via the CMS.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Body
        type: rich-text

settings:
  content:
    merge: true
