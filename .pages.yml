# Pages CMS — https://app.pagescms.org/
# Edit content and media here; contributors sign in with email (magic link). Repo backend: GitHub; config drives the CMS UI.

# Restrict to web-friendly formats to avoid huge files that can trigger 504 on upload.
# Pages CMS allows several media sources. `images` stays first so image fields and
# rich-text inserts keep the image library. Audio is a separate folder (no wav:
# uncompressed clips blow the upload limit). Keep clips under about 10 MB.
media:
  - name: images
    label: Images
    input: assets/images/uploads
    output: /images/uploads
    extensions: [jpg, jpeg, png, webp, gif]
  - name: audio
    label: Audio
    input: assets/audio/uploads
    output: /audio/uploads
    extensions: [mp3, m4a, ogg]

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    exclude: [_index.md]
    view:
      primary: name
      fields: [name, slug, draft]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly id (e.g. eric-wisnewski). Must match the filename. Posts reference this value; the public page is /authors/<slug>/.
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Leave on for new writers so /authors/<slug>/ stays off the live site. Uncheck when they should go public.
      - name: bio
        label: Bio
        type: text
        required: true
        description: Short bio shown at the top of the author page and under posts.
      - name: image
        label: Photo
        type: image
        required: false
        description: Author photo shown with the bio under posts.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Notes
        type: text
        required: false
        description: Optional internal notes (not shown on the site).
        hidden: true

  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. my-first-post). Used for the filename.
      - name: author
        label: Authors
        type: reference
        required: true
        description: Who wrote this post. Pick every writer. Add people under Authors first. Grady's travel posts belong in Grady's Tour; Tad's posts belong in Da Breakdown w Tad; Jeremy's posts belong in Jeremy On Tap, not here. On a shared post, also fill Who wrote what.
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
          multiple: true
          min: 1
          max: 4
      - name: date
        label: Publish Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-02-26T10:25:00Z). Hugo requires RFC3339; missing seconds can cause "date front matter field is not a parsable date". The value is stored as UTC.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: New posts stay off the live site until you uncheck this. Leave on for new authors.
      - name: image
        label: Featured Image
        type: image
        required: false
        description: Pick from the media library or upload via the CMS.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: gallery
        label: Gallery
        type: image
        required: false
        description: Upload several photos at once (Photos app or files), then remove any you do not want. They appear as a grid on the post. Prefer JPEG/PNG; huge originals can fail to save.
        options:
          multiple:
            max: 12
          unique: true
          extensions: [jpg, jpeg, png, webp, gif]
      - name: scoreboard
        label: Scoreboard
        type: object
        required: false
        description: Optional. Eric’s game recaps only — fill all four fields to show a gym flip-card final on the post. Leave blank otherwise.
        fields:
          - name: home
            label: Home school
            type: string
            required: false
            description: Full school name (e.g. Boston College).
          - name: home_score
            label: Home score
            type: number
            required: false
          - name: away
            label: Visitor school
            type: string
            required: false
            description: Full school name (e.g. University of California).
          - name: away_score
            label: Visitor score
            type: number
            required: false
      - name: report_card
        label: Report card
        type: object
        required: false
        description: Optional. Eric’s recaps only — fill School plus all three grades to show a paper report card under the scoreboard. Leave blank otherwise.
        fields:
          - name: school
            label: School
            type: string
            required: false
            description: Full school name (e.g. Boston College).
          - name: year
            label: Year
            type: number
            required: false
            description: Year of the visit (e.g. 2026). Leave blank to use the publish date year.
          - name: stadium
            label: Stadium grade
            type: select
            required: false
            description: Letter grade for the arena, including plus and minus (A+ through F-).
            options:
              placeholder: Select a grade
              values: ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F+", "F", "F-", "N/A (A+)"]
          - name: fan_base
            label: Fan base grade
            type: select
            required: false
            description: Letter grade for the crowd, including plus and minus (A+ through F-).
            options:
              placeholder: Select a grade
              values: ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F+", "F", "F-", "N/A (A+)"]
          - name: campus
            label: Campus grade
            type: select
            required: false
            description: Letter grade for the campus, including plus and minus. N/A (A+) is for a campus Eric did not really tour.
            options:
              placeholder: Select a grade
              values: ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D+", "D", "D-", "F+", "F", "F-", "N/A (A+)"]
      - name: body
        label: Body
        type: rich-text
        description: Shared intro, or the whole post when one person wrote it. Paste a YouTube or X/Twitter status URL on its own line to embed it. Upload an mp3, m4a, or ogg in Audio upload (under about 10 MB), then paste that /audio/uploads/ path on its own line where the clip should play.
        options:
          media: images
      - name: audio_upload
        label: Audio upload
        type: file
        required: false
        description: Uploads the file only — it does not place a player. Copy the path (/audio/uploads/…) into the body on its own line, or use the audio shortcode. mp3, m4a, or ogg. Keep clips under about 10 MB so the upload does not 504.
        options:
          media: audio
          extensions: [mp3, m4a, ogg]
      - name: parts
        label: Who wrote what
        type: object
        required: false
        list: true
        description: Optional. For a shared post, add one block per writer. Their name appears above their text. Leave empty when one person wrote the whole post in Body.
        fields:
          - name: author
            label: Writer
            type: reference
            required: true
            options:
              collection: authors
              search: "name,slug"
              value: "{fields.slug}"
              label: "{fields.name}"
          - name: body
            label: Their text
            type: rich-text
            required: true
            description: Paste a YouTube or X/Twitter status URL on its own line to embed it. An uploaded audio path (/audio/uploads/….mp3, .m4a, or .ogg) on its own line becomes a player. Keep clips under about 10 MB.
            options:
              media: images

