# Pages CMS — https://app.pagescms.org/
# Edit content and media here; contributors sign in with email (magic link). Repo backend: GitHub; config drives the CMS UI.

# Restrict to web-friendly formats to avoid huge files that can trigger 504 on upload.
media:
  input: assets/images/uploads
  output: /images/uploads
  extensions: [jpg, jpeg, png, webp, gif]

content:
  - name: authors
    label: Authors
    type: collection
    path: content/authors
    format: yaml-frontmatter
    filename: "{{slug}}.md"
    exclude: [_index.md]
    view:
      primary: name
      fields: [name, slug]
      sort: [name]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly id (e.g. eric-wisnewski). Must match the filename. Posts reference this value; the public page is /authors/<slug>/.
      - name: bio
        label: Bio
        type: text
        required: true
        description: Short bio shown at the top of the author page and under posts.
      - name: image
        label: Photo
        type: image
        required: false
        description: Author photo shown with the bio under posts.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Notes
        type: text
        required: false
        description: Optional internal notes (not shown on the site).
        hidden: true

  - name: posts
    label: Posts
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{{slug}}.md"
    subfolders: false
    view:
      primary: title
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. my-first-post). Used for the filename.
      - name: author
        label: Author
        type: reference
        required: true
        description: Who wrote this post. Add people under Authors first. Grady's travel posts belong in the Grady's Tour collection, not here.
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: date
        label: Publish Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-02-26T10:25:00Z). Hugo requires RFC3339; missing seconds can cause "date front matter field is not a parsable date". The value is stored as UTC.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Featured Image
        type: image
        required: false
        description: Pick from the media library or upload via the CMS.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: gallery
        label: Gallery
        type: image
        required: false
        description: Upload several photos at once (Photos app or files), then remove any you do not want. They appear as a grid on the post. Prefer JPEG/PNG; huge originals can fail to save.
        options:
          multiple:
            max: 12
          unique: true
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Body
        type: rich-text

  - name: gradys-tour
    label: Grady's Tour
    type: collection
    path: content/gradys-tour
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    exclude: [_index.md]
    subfolders: false
    view:
      primary: title
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. from-boat-to-bus). Lowercase letters and hyphens only; this becomes the filename and /gradys-tour/<slug>/ URL.
      - name: author
        label: Author
        type: reference
        required: true
        default: grady-davis
        description: Who wrote this post. Travel posts in this folder also appear on the home page (latest first) and on this author's /authors/<slug>/ page.
        options:
          collection: authors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: date
        label: Publish Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-02-26T10:25:00Z). Hugo requires RFC3339; missing seconds can cause "date front matter field is not a parsable date". The value is stored as UTC.
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Featured Image
        type: image
        required: false
        description: Pick from the media library or upload via the CMS.
        options:
          extensions: [jpg, jpeg, png, webp, gif]
      - name: gallery
        label: Gallery
        type: image
        required: false
        description: Upload several photos at once (Photos app or files), then remove any you do not want. They appear as a grid on the post. Prefer JPEG/PNG; huge originals can fail to save.
        options:
          multiple:
            max: 12
          unique: true
          extensions: [jpg, jpeg, png, webp, gif]
      - name: body
        label: Body
        type: rich-text

  - name: updates
    label: Site updates
    type: collection
    path: content/updates
    format: yaml-frontmatter
    filename: "{{slug}}.md"
    exclude: [_index.md]
    subfolders: false
    view:
      primary: title
      fields: [title, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Short headline for readers (not a blog post).
      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly id (e.g. email-if-you-want). Used for the filename.
      - name: date
        label: Date
        type: date
        required: true
        description: Use a date/time that saves as ISO 8601 with seconds (e.g. 2026-08-22T12:00:00Z).
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ss'Z'"
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
        description: A few sentences, in plain language, about what got better for readers.

settings:
  content:
    merge: true
