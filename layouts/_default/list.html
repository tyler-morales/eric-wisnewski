{{ define "title" }}{{ .Site.Title }}{{ end }}

{{ define "main" }}
  {{ partial "header.html" . }}
  <main>
    <ul class="post-list">
      {{ $posts := where .Site.RegularPages "Section" "posts" }}
      {{ range $posts }}
        {{ if not (partial "is-tour-post.html" .) }}
          {{ partial "post-list-item.html" . }}
        {{ end }}
      {{ end }}
    </ul>
  </main>
{{ end }}
