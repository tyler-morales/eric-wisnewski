{{ define "title" }}{{ .Site.Title }}{{ end }}

{{ define "main" }}
  {{ partial "header.html" . }}
  <main>
    <ul class="post-list">
      {{ $posts := where .Site.RegularPages "Section" "posts" }}
      {{ $posts = where $posts "Params.author" "!=" "grady-davis" }}
      {{ range $posts }}
        {{ partial "post-list-item.html" . }}
      {{ end }}
    </ul>
  </main>
{{ end }}
