{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
{{ partial "header.html" . }}
<main>
  <article class="post-content subscribe-status-page">
    <header>
      <h1>{{ .Title }}</h1>
    </header>
    <section id="subscribe-manage" class="subscribe-section subscribe-manage" aria-label="Email preferences">
      <p id="subscribe-manage-email" class="subscribe-manage-email" hidden></p>
      <form class="subscribe-form" aria-label="Update email preferences">
        <fieldset class="subscribe-lists">
          <legend>Notify me about</legend>
          <label class="subscribe-list-option">
            <input type="checkbox" name="lists" value="posts">
            Eric’s blog
          </label>
          <label class="subscribe-list-option">
            <input type="checkbox" name="lists" value="gradys-tour">
            Grady’s Tour
          </label>
          {{ if partial "has-da-breakdown-posts.html" . }}
          <label class="subscribe-list-option">
            <input type="checkbox" name="lists" value="da-breakdown-w-tad">
            Da Breakdown w Tad
          </label>
          {{ end }}
        </fieldset>
        <div class="subscribe-form-actions">
          <button type="submit">Save preferences</button>
        </div>
        <p class="subscribe-status" role="status" aria-live="polite" hidden></p>
        <p class="subscribe-error" role="alert" aria-live="assertive" tabindex="-1" hidden></p>
      </form>
    </section>
  </article>
</main>
<script type="module" src="{{ "/js/subscribe.js" | relURL }}?v={{ md5 (readFile "static/js/subscribe.js") }}"></script>
{{ end }}
