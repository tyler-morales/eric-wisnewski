{{/*
  Rewrite CMS leftover YouTube <a> tags into privacy embeds.
  Context is an HTML string (page .Content or a parts body).
*/}}
{{- $html := . -}}
{{- $html = replaceRE `<a href="https://(?:www\.)?(?:youtube\.com/watch\?v=|youtu\.be/)([A-Za-z0-9_-]{11})[^"]*"[^>]*>https?://[^<]*</a>` `<iframe class="youtube-embed" src="https://www.youtube-nocookie.com/embed/$1" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>` $html -}}
{{- $html | safeHTML -}}
